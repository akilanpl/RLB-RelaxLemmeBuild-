name: RLB checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
        env:
          RLB_ENV_FILE: backend/.env.example
          ENVIRONMENT: test
          DATABASE_URL: ''
          SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
          DAYTONA_API_KEY: ''
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  retention-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rlb_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: rlb_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rlb_test -d rlb_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/integration -q
        env:
          RLB_ENV_FILE: backend/.env.example
          RLB_TEST_DATABASE_URL: postgresql+asyncpg://rlb_test:local_test_only@127.0.0.1:5432/rlb_test
