name: RLB checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
        env:
          RLB_ENV_FILE: backend/.env.example
          ENVIRONMENT: test
          DATABASE_URL: ''
          SUPABASE_URL: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
          DAYTONA_API_KEY: ''
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  retention-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rlb_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: rlb_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rlb_test -d rlb_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/integration -q
        env:
          RLB_ENV_FILE: backend/.env.example
          RLB_TEST_DATABASE_URL: postgresql+asyncpg://rlb_test:local_test_only@127.0.0.1:5432/rlb_test
  postgres-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ghcr.io/pgmq/pg18-pgmq:v1.10.0
        env:
          POSTGRES_USER: rlb_test
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: rlb_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rlb_test -d rlb_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/hosted_integration -q
        env:
          RLB_ENV_FILE: backend/.env.example
          RLB_TEST_DATABASE_URL: postgresql+asyncpg://rlb_test:local_test_only@127.0.0.1:5432/rlb_test

      - name: Disposable database backup and restore
        run: |
          docker exec ${{ job.services.postgres.id }} pg_dump -U rlb_test -Fc -f /tmp/rlb.dump rlb_test
          docker exec ${{ job.services.postgres.id }} createdb -U rlb_test rlb_restore
          docker exec ${{ job.services.postgres.id }} pg_restore -U rlb_test --exit-on-error -d rlb_restore /tmp/rlb.dump
          docker exec -i ${{ job.services.postgres.id }} psql -U rlb_test -d rlb_restore -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN IF NOT EXISTS(SELECT 1 FROM tasks) THEN RAISE EXCEPTION 'Restored task missing'; END IF; END $$;
          SQL

  windows-desktop:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/Scripts/python.exe -m pip install -r backend/requirements-desktop.txt -r backend/requirements-dev.txt
          npm ci --prefix frontend
          npm ci --prefix desktop
      - name: Source and Windows local authority checks
        run: |
          npm --prefix frontend run test
          npm --prefix frontend run lint
          npm --prefix frontend run typecheck
          npm --prefix desktop run check
          backend/.venv/Scripts/python.exe -m pytest backend/tests/test_v1_local_end_to_end.py backend/tests/test_desktop_lifecycle.py backend/tests/test_local_runtime.py backend/tests/test_device_connection.py backend/tests/test_device_control.py backend/tests/test_task_artifacts.py -q
        env:
          RLB_ENV_FILE: backend/.env.example
      - name: Build Windows x64 installer and private toolchains
        run: npm --prefix desktop run dist
      - name: Install, launch, upgrade and uninstall on disposable Windows user
        run: |
          $installer = (Get-ChildItem desktop/release/RLB-Setup-*.exe | Select-Object -First 1).FullName
          ./desktop/windows_installer_smoke.ps1 -Installer $installer
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RLB-Windows-V1
          path: |
            desktop/release/RLB-Setup-*.exe
            desktop/release/builder-effective-config.yaml
          if-no-files-found: warn
