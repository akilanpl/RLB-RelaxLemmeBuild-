<script>
const video=document.getElementById('background'),button=document.getElementById('motion');
function sync(){const paused=video.paused;button.setAttribute('aria-label',paused?'Play background video':'Pause background video');button.title=button.getAttribute('aria-label');button.innerHTML=paused?'<svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 1 8 5-8 5z"/></svg>':'<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1h3v10H2zm5 0h3v10H7z"/></svg>'}
